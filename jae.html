<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 - 재개발·재건축 정보</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* 어두운 헤더 */
        header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1000;
        }
        /* 메인 컨테이너 (지도 + 플로팅 패널) */
        .main-container {
            position: relative;
            flex: 1;
            width: 100%;
        }
        /* 지도 영역 */
        #map {
            width: 100%;
            height: 100%;
        }
        /* 우측 플로팅 정보 패널 */
        .floating-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .floating-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #333;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 8px;
        }
        /* 도형 목록 스타일 */
        #item-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .item-row {
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .item-row:hover {
            background-color: #f0f0f0;
        }
        .item-row.active {
            background-color: #1a1a1a;
            color: #fff;
        }
        /* 상세 정보 표시 칸 */
        .detail-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e1e1e1;
            font-size: 0.9rem;
            min-height: 80px;
            color: #555;
        }
        .detail-box h4 {
            color: #1a1a1a;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        사이트
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-container">
        <!-- 지도 -->
        <div id="map"></div>

        <!-- 우측 플로팅 정보 패널 -->
        <div class="floating-panel">
            <h3>구역 목록</h3>
            <div id="item-list">
                <div style="padding: 10px; color: #888; text-align: center;">KML 파일을 불러오는 중...</div>
            </div>
            
            <h3>상세 정보</h3>
            <div class="detail-box" id="detail-content">
                지도의 구역이나 목록의 이름을 클릭하세요.
            </div>
        </div>
    </div>

    <!-- Leaflet JS 및 Omnivore (KML 로더) 라이브러리 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>

    <script>
        // 1. 지도 초기화 (기본 중심 좌표 및 줌 레벨 설정 - 예: 서울 중심)
        var map = L.map('map').setView([37.5665, 126.9780], 13);

        // 2. 배경 지도 타일 추가 (OpenStreetMap 사용 - API 키 불필요)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const itemListEl = document.getElementById('item-list');
        const detailContentEl = document.getElementById('detail-content');
        
        let zonesData = [];

        // 3. assets/jae.kml 파일 불러오기
        omnivore.kml('assets/jae.kml')
            .on('ready', function(layer) {
                itemListEl.innerHTML = ''; // 로딩 문구 제거
                
                this.eachLayer(function(layer) {
                    // KML 내부의 이름(name) 및 설명(description) 가져오기
                    let name = layer.feature.properties.name || '이름 없는 구역';
                    let description = layer.feature.properties.description || '상세 정보가 없습니다.';
                    
                    zonesData.push({ name, description, layer });

                    // 목록(HTML)에 항목 추가
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerText = name;
                    
                    // 목록 이름을 클릭했을 때의 동작
                    row.addEventListener('click', function() {
                        selectZone(name, description, layer);
                    });

                    // 지도 위 도형을 클릭했을 때의 동작
                    layer.on('click', function() {
                        selectZone(name, description, layer);
                        // 해당 도형 위치로 지도 이동 (폴리곤인 경우 중심점 계산)
                        if (layer.getBounds) {
                            map.fitBounds(layer.getBounds());
                        } else if (layer.getLatLng) {
                            map.setView(layer.getLatLng(), 15);
                        }
                    });

                    itemListEl.appendChild(row);
                });

                if (zonesData.length === 0) {
                    itemListEl.innerHTML = '<div style="padding: 10px; color: #888; text-align: center;">표시할 구역이 없습니다.</div>';
                }
            })
            .on('error', function(err) {
                itemListEl.innerHTML = '<div style="padding: 10px; color: red; text-align: center;">KML 로드 실패 (경로 확인 필요)</div>';
                console.error("KML Load Error:", err);
            })
            .addTo(map);

        // 구역 선택 시 실행되는 공통 함수
        function selectZone(name, description, layer) {
            // 상세 정보 창 업데이트
            detailContentEl.innerHTML = `<h4>${name}</h4><p>${description}</p>`;

            // 목록 UI 활성화 상태 변경
            document.querySelectorAll('.item-row').forEach(el => {
                if (el.innerText === name) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // 도형 스타일 강조 (선택사항: 클릭 시 색상 변경 등)
            layer.setStyle({ color: '#ff4757', fillColor: '#ff6b81', fillOpacity: 0.5 });
        }
    </script>
</body>
</html>
