<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 - 재개발·재건축 정보</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* 어두운 헤더 */
        header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1000;
        }
        /* 메인 컨테이너 (지도 + 플로팅 패널) */
        .main-container {
            position: relative;
            flex: 1;
            width: 100%;
        }
        /* 지도 영역 */
        #map {
            width: 100%;
            height: 100%;
        }
        /* 우측 플로팅 정보 패널 */
        .floating-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .floating-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #333;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 8px;
        }
        /* 도형 목록 스타일 */
        #item-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .item-row {
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .item-row:hover {
            background-color: #f0f0f0;
        }
        .item-row.active {
            background-color: #1a1a1a;
            color: #fff;
        }
        /* 상세 정보 표시 칸 */
        .detail-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e1e1e1;
            font-size: 0.9rem;
            min-height: 80px;
            color: #555;
        }
        .detail-box h4 {
            color: #1a1a1a;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        사이트
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-container">
        <!-- 지도 -->
        <div id="map"></div>

        <!-- 우측 플로팅 정보 패널 -->
        <div class="floating-panel">
            <h3>구역 목록</h3>
            <div id="item-list">
                <div style="padding: 10px; color: #888; text-align: center;">KML 파일을 불러오는 중...</div>
            </div>
            
            <h3>상세 정보</h3>
            <div class="detail-box" id="detail-content">
                지도의 구역이나 목록의 이름을 클릭하세요.
            </div>
        </div>
    </div>

    <!-- Leaflet JS 및 Omnivore (KML 로더) 라이브러리 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>

    <script>
        // 1. 지도 초기화
        var map = L.map('map').setView([37.5665, 126.9780], 13);

        // 2. 배경 지도 타일 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const itemListEl = document.getElementById('item-list');
        const detailContentEl = document.getElementById('detail-content');
        
        let zonesData = [];
        let currentlySelectedLayer = null; // 현재 선택된 도형 추적 변수

        // 기본 도형 스타일 및 선택된 도형 스타일 정의
        const defaultStyle = { color: '#3388ff', fillColor: '#3388ff', fillOpacity: 0.2 };
        const selectedStyle = { color: '#ff4757', fillColor: '#ff6b81', fillOpacity: 0.5 };

        // 3. assets/jae.kml 파일 불러오기
        omnivore.kml('assets/jae.kml')
            .on('ready', function(layer) {
                itemListEl.innerHTML = ''; // 로딩 문구 제거
                
                this.eachLayer(function(layer) {
                    let name = layer.feature.properties.name || '이름 없는 구역';
                    let description = layer.feature.properties.description || '상세 정보가 없습니다.';
                    
                    // 기본 스타일 적용
                    if (layer.setStyle) {
                        layer.setStyle(defaultStyle);
                    }

                    zonesData.push({ name, description, layer });

                    // 목록(HTML)에 항목 추가
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerText = name;
                    
                    // 우측 패널 목록을 클릭했을 때의 동작
                    row.addEventListener('click', function(e) {
                        e.stopPropagation(); // 지도 배경 클릭 이벤트로 전파되는 것 방지
                        selectZone(name, description, layer);
                        moveToZone(layer); // 지도 중앙으로 이동
                    });

                    // 지도 위 도형을 클릭했을 때의 동작
                    layer.on('click', function(e) {
                        L.DomEvent.stopPropagation(e); // 이벤트 버블링 차단
                        selectZone(name, description, layer);
                        moveToZone(layer); // 지도 중앙으로 이동
                    });

                    itemListEl.appendChild(row);
                });

                if (zonesData.length === 0) {
                    itemListEl.innerHTML = '<div style="padding: 10px; color: #888; text-align: center;">표시할 구역이 없습니다.</div>';
                }
            })
            .on('error', function(err) {
                itemListEl.innerHTML = '<div style="padding: 10px; color: red; text-align: center;">KML 로드 실패</div>';
                console.error("KML Load Error:", err);
            })
            .addTo(map);

        // 지도 배경(도형 외의 빈 곳)을 클릭했을 때 모든 선택 해제
        map.on('click', function() {
            clearSelection();
        });

        // 구역 선택 시 실행되는 함수
        function selectZone(name, description, layer) {
            // 1. 기존에 선택되어 있던 도형이 있다면 원래 색상으로 복원
            if (currentlySelectedLayer && currentlySelectedLayer !== layer) {
                if (currentlySelectedLayer.setStyle) {
                    currentlySelectedLayer.setStyle(defaultStyle);
                }
            }

            // 2. 현재 선택된 도형을 갱신하고 강조 스타일 적용
            currentlySelectedLayer = layer;
            if (layer.setStyle) {
                layer.setStyle(selectedStyle);
            }

            // 3. 상세 정보 창 업데이트
            detailContentEl.innerHTML = `<h4>${name}</h4><p>${description}</p>`;

            // 4. 우측 목록 UI 활성화 상태 변경
            document.querySelectorAll('.item-row').forEach(el => {
                if (el.innerText === name) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // 선택 해제 및 색상 복원 함수
        function clearSelection() {
            if (currentlySelectedLayer) {
                if (currentlySelectedLayer.setStyle) {
                    currentlySelectedLayer.setStyle(defaultStyle);
                }
                currentlySelectedLayer = null;
            }
            // 우측 패널 내용 및 활성화 초기화
            detailContentEl.innerHTML = '지도의 구역이나 목록의 이름을 클릭하세요.';
            document.querySelectorAll('.item-row').forEach(el => {
                el.classList.remove('active');
            });
        }

        // 해당 구역으로 지도 이동시키는 함수
        function moveToZone(layer) {
            if (layer.getBounds) {
                // 폴리곤 등 영역이 있는 경우 영역에 맞춰서 줌/이동
                map.fitBounds(layer.getBounds(), { padding: [50, 50] });
            } else if (layer.getLatLng) {
                // 단일 마커인 경우 해당 좌표로 이동
                map.setView(layer.getLatLng(), 16);
            }
        }
    </script>
</body>
</html>
