<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 - 재개발·재건축 정보</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* 어두운 헤더 */
        header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1000;
            flex-shrink: 0;
        }
        /* 데스크톱 기준 메인 레이아웃: 좌우 배치 (고정형) */
        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 54px);
            overflow: hidden;
        }
        /* 지도 영역 (데스크톱: 왼쪽) */
        #map {
            flex: 1;
            height: 100%;
        }
        /* 고정형 정보 패널 (데스크톱: 오른쪽 너비 360px) */
        .side-panel {
            width: 360px;
            background: #ffffff;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
            z-index: 999;
            overflow: hidden;
        }
        .side-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #333;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 6px;
        }
        /* 폴더 및 목록 컨테이너 스타일 */
        #folder-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        /* 폴더 그룹 스타일 */
        .folder-group {
            border-bottom: 1px solid #eee;
        }
        .folder-title {
            background-color: #f1f2f6;
            padding: 10px 12px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #2f3542;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .folder-title:hover {
            background-color: #dfe4ea;
        }
        .folder-items {
            display: block;
        }
        /* 개별 구역 아이템 스타일 */
        .item-row {
            padding: 8px 12px 8px 24px;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid #f8f9fa;
            transition: background 0.2s;
        }
        .item-row:hover {
            background-color: #f0f0f0;
        }
        .item-row.active {
            background-color: #1a1a1a;
            color: #fff;
        }
        /* 상세 정보 표시 칸 */
        .detail-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e1e1e1;
            font-size: 0.9rem;
            min-height: 90px;
            max-height: 160px;
            overflow-y: auto;
            color: #555;
            flex-shrink: 0;
        }
        .detail-box h4 {
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        /* 📱 모바일 환경 대응 (너비 768px 이하) */
        @media (max-width: 768px) {
            body {
                overflow: auto; /* 모바일에서는 전체 스크롤 허용 */
                height: auto;
            }
            .main-container {
                flex-direction: column; /* 상하 배치 */
                height: auto;
            }
            #map {
                width: 100%;
                /* 16:9 비율 유지 (너비 기준 높이 계산) */
                height: calc(100vw * 9 / 16);
                flex: none;
            }
            .side-panel {
                width: 100%;
                height: auto;
                border-left: none;
                border-top: 1px solid #ddd;
                box-shadow: none;
                padding: 15px;
            }
            #folder-list {
                max-height: 250px; /* 모바일에서 목록 영역 높이 제한 */
            }
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        사이트
    </header>

    <!-- 메인 콘텐츠 영역 (고정형 레이아웃) -->
    <div class="main-container">
        <!-- 지도 영역 -->
        <div id="map"></div>

        <!-- 우측 고정형 정보 패널 -->
        <div class="side-panel">
            <h3>구역 목록</h3>
            <div id="folder-list">
                <div style="padding: 15px; color: #888; text-align: center;">KML 파일을 불러오는 중...</div>
            </div>
            
            <h3>상세 정보</h3>
            <div class="detail-box" id="detail-content">
                지도의 구역이나 목록의 이름을 클릭하세요.
            </div>
        </div>
    </div>

    <!-- Leaflet JS 및 Omnivore (KML 로더) 라이브러리 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>

    <script>
        // 1. 지도 초기화
        var map = L.map('map').setView([37.5665, 126.9780], 13);

        // 2. 배경 지도 타일 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const folderListEl = document.getElementById('folder-list');
        const detailContentEl = document.getElementById('detail-content');
        
        let currentlySelectedLayer = null;
        const defaultStyle = { color: '#3388ff', fillColor: '#3388ff', fillOpacity: 0.2 };
        const selectedStyle = { color: '#ff4757', fillColor: '#ff6b81', fillOpacity: 0.5 };

        // 폴더별로 엘리먼트를 관리하기 위한 객체
        let foldersData = {
            "동대문구": { title: "동대문구", el: null, itemsEl: null, hasItems: false },
            "중랑구": { title: "중랑구", el: null, itemsEl: null, hasItems: false },
            "기타 구역": { title: "기타 구역", el: null, itemsEl: null, hasItems: false }
        };

        // UI에 폴더 구조 미리 생성
        function initFoldersUI() {
            folderListEl.innerHTML = '';
            for (let key in foldersData) {
                let folderGroupDiv = document.createElement('div');
                folderGroupDiv.className = 'folder-group';

                let folderTitleDiv = document.createElement('div');
                folderTitleDiv.className = 'folder-title';
                folderTitleDiv.innerHTML = `<span>📁 ${foldersData[key].title}</span><span>▼</span>`;
                
                let folderItemsDiv = document.createElement('div');
                folderItemsDiv.className = 'folder-items';

                // 폴더 토글 기능
                folderTitleDiv.addEventListener('click', function() {
                    if (folderItemsDiv.style.display === 'none') {
                        folderItemsDiv.style.display = 'block';
                        folderTitleDiv.lastChild.innerText = '▼';
                    } else {
                        folderItemsDiv.style.display = 'none';
                        folderTitleDiv.lastChild.innerText = '▶';
                    }
                });

                folderGroupDiv.appendChild(folderTitleDiv);
                folderGroupDiv.appendChild(folderItemsDiv);
                
                // 일단 DOM에 추가하되, 나중에 아이템이 없으면 숨길 수 있음
                folderListEl.appendChild(folderGroupDiv);
                foldersData[key].el = folderGroupDiv;
                foldersData[key].itemsEl = folderItemsDiv;
                folderGroupDiv.style.display = 'none'; // 초기엔 숨김 (아이템이 들어올 때 표시)
            }
        }

        initFoldersUI();

        // 3. assets/jae.kml 파일 불러오기
        omnivore.kml('assets/jae.kml')
            .on('ready', function() {
                let hasAnyItem = false;

                this.eachLayer(function(layer) {
                    let name = (layer.feature && layer.feature.properties && layer.feature.properties.name) ? layer.feature.properties.name : '이름 없는 구역';
                    let description = (layer.feature && layer.feature.properties && layer.feature.properties.description) ? layer.feature.properties.description : '';

                    // 기본 스타일 적용
                    if (layer.setStyle) {
                        layer.setStyle(defaultStyle);
                    }

                    // 소재지 분석 ("소재지: 동대문구" 또는 "소재지: 중랑구" 탐색)
                    let targetFolder = "기타 구역";
                    if (description.includes("동대문구")) {
                        targetFolder = "동대문구";
                    } else if (description.includes("중랑구")) {
                        targetFolder = "중랑구";
                    }

                    hasAnyItem = true;
                    foldersData[targetFolder].hasItems = true;
                    foldersData[targetFolder].el.style.display = 'block'; // 아이템이 있으므로 폴더 표시

                    // 우측(하단) 목록에 항목 추가
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerText = `📍 ${name}`;

                    // 목록 클릭 시
                    row.addEventListener('click', function(e) {
                        e.stopPropagation();
                        selectZone(name, description, layer);
                        moveToZone(layer);
                    });

                    // 지도 위 도형 클릭 시
                    layer.on('click', function(e) {
                        L.DomEvent.stopPropagation(e);
                        selectZone(name, description, layer);
                        moveToZone(layer);
                    });

                    foldersData[targetFolder].itemsEl.appendChild(row);
                });

                if (!hasAnyItem) {
                    folderListEl.innerHTML = '<div style="padding: 15px; color: #888; text-align: center;">표시할 구역이 없습니다.</div>';
                }
            })
            .on('error', function(err) {
                folderListEl.innerHTML = '<div style="padding: 15px; color: red; text-align: center;">KML 로드 실패 (경로 확인)</div>';
                console.error("KML Load Error:", err);
            })
            .addTo(map);

        // 지도 빈 배경 클릭 시 선택 초기화
        map.on('click', function() {
            clearSelection();
        });

        // 구역 선택 공통 함수
        function selectZone(name, description, layer) {
            if (currentlySelectedLayer && currentlySelectedLayer !== layer) {
                if (currentlySelectedLayer.setStyle) {
                    currentlySelectedLayer.setStyle(defaultStyle);
                }
            }

            currentlySelectedLayer = layer;
            if (layer.setStyle) {
                layer.setStyle(selectedStyle);
            }

            // HTML 태그가 description에 포함되어 있을 수 있으므로 innerText 대신 innerHTML 사용 가능
            detailContentEl.innerHTML = `<h4>${name}</h4><p>${description || '상세 정보가 없습니다.'}</p>`;

            document.querySelectorAll('.item-row').forEach(el => {
                if (el.innerText.includes(name)) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // 선택 초기화 함수
        function clearSelection() {
            if (currentlySelectedLayer) {
                if (currentlySelectedLayer.setStyle) {
                    currentlySelectedLayer.setStyle(defaultStyle);
                }
                currentlySelectedLayer = null;
            }
            detailContentEl.innerHTML = '지도의 구역이나 목록의 이름을 클릭하세요.';
            document.querySelectorAll('.item-row').forEach(el => {
                el.classList.remove('active');
            });
        }

        // 지도 이동 함수
        function moveToZone(layer) {
            if (layer.getBounds) {
                map.fitBounds(layer.getBounds(), { padding: [50, 50] });
            } else if (layer.getLatLng) {
                map.setView(layer.getLatLng(), 16);
            }
        }
    </script>
</body>
</html>
