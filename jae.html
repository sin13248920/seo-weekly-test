<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 - 재개발·재건축 정보</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* 어두운 헤더 */
        header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1000;
            flex-shrink: 0;
        }
        /* 메인 레이아웃: 좌우 배치 (고정형) */
        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 54px);
            overflow: hidden;
        }
        /* 지도 영역 (데스크톱: 왼쪽) */
        #map {
            flex: 1;
            height: 100%;
        }
        /* 고정형 패널 (데스크톱: 오른쪽 너비 360px, 각진 테두리) */
        .side-panel {
            width: 360px;
            background: #ffffff;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
            z-index: 999;
            overflow: hidden;
            border-radius: 0; /* 각지게 설정 */
        }
        .side-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #333;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 6px;
        }
        /* 각진 폴더 및 목록 컨테이너 */
        #folder-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 0; /* 각지게 설정 */
            background: #fff;
        }
        /* 폴더 그룹 스타일 */
        .folder-group {
            border-bottom: 1px solid #eee;
        }
        .folder-title {
            background-color: #f1f2f6;
            padding: 10px 12px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #2f3542;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0;
        }
        .folder-title:hover {
            background-color: #dfe4ea;
        }
        .folder-items {
            display: block;
        }
        /* 개별 구역 아이템 스타일 */
        .item-row {
            padding: 8px 12px 8px 24px;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid #f8f9fa;
            transition: background 0.2s;
            border-radius: 0;
        }
        .item-row:hover {
            background-color: #f0f0f0;
        }
        .item-row.active {
            background-color: #1a1a1a;
            color: #fff;
        }

        /* 뷰 전환용 클래스 (목록 뷰 vs 상세 뷰) */
        .view-section {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }
        .view-section.active {
            display: flex;
        }

        /* 뒤로가기 버튼 스타일 */
        .back-btn-container {
            margin-bottom: 15px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f2f6;
            border: 1px solid #ddd;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            border-radius: 0; /* 각지게 */
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #dfe4ea;
        }
        /* 180도 회전한 화살표 이미지 스타일 */
        .back-arrow-img {
            width: 16px;
            height: 16px;
            transform: rotate(180deg);
        }

        /* 상세 정보 내용 칸 (각진 디자인) */
        .detail-content-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 0; /* 각지게 */
            border: 1px solid #e1e1e1;
            font-size: 0.95rem;
            overflow-y: auto;
            flex: 1;
            color: #555;
            line-height: 1.5;
        }
        .detail-content-box h4 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        /* 📱 모바일 환경 대응 (너비 768px 이하) */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .main-container {
                flex-direction: column;
                height: auto;
            }
            #map {
                width: 100%;
                height: calc(100vw * 9 / 16); /* 16:9 비율 유지 */
                flex: none;
            }
            .side-panel {
                width: 100%;
                height: 400px; /* 모바일에서 패널 고정 높이 */
                border-left: none;
                border-top: 1px solid #ddd;
                box-shadow: none;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        사이트
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-container">
        <!-- 지도 영역 -->
        <div id="map"></div>

        <!-- 우측 고정형 패널 -->
        <div class="side-panel">
            
            <!-- 1. 구역 목록 뷰 -->
            <div id="listView" class="view-section active">
                <h3>구역 목록</h3>
                <div id="folder-list">
                    <div style="padding: 15px; color: #888; text-align: center;">KML 파일을 불러오는 중...</div>
                </div>
            </div>

            <!-- 2. 구역 상세 정보 뷰 (처음엔 숨겨짐) -->
            <div id="detailView" class="view-section">
                <div class="back-btn-container">
                    <button class="back-btn" id="backBtn">
                        <img src="assets/raroow.png" class="back-arrow-img" alt="뒤로가기"> 목록으로
                    </button>
                </div>
                <h3>구역 정보</h3>
                <div class="detail-content-box" id="detail-content">
                    <!-- 상세 내용이 동적으로 들어갑니다 -->
                </div>
            </div>

        </div>
    </div>

    <!-- Leaflet JS 및 Omnivore (KML 로더) 라이브러리 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>

    <script>
        // 1. 지도 초기화
        var map = L.map('map').setView([37.5665, 126.9780], 13);

        // 2. 배경 지도 타일 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const folderListEl = document.getElementById('folder-list');
        const listViewEl = document.getElementById('listView');
        const detailViewEl = document.getElementById('detailView');
        const detailContentEl = document.getElementById('detail-content');
        const backBtn = document.getElementById('backBtn');
        
        let currentlySelectedLayer = null;
        const defaultStyle = { color: '#3388ff', fillColor: '#3388ff', fillOpacity: 0.2 };
        const selectedStyle = { color: '#ff4757', fillColor: '#ff6b81', fillOpacity: 0.5 };

        // 폴더 구조 객체
        let foldersData = {
            "동대문구": { title: "동대문구", el: null, itemsEl: null },
            "중랑구": { title: "중랑구", el: null, itemsEl: null },
            "기타 구역": { title: "기타 구역", el: null, itemsEl: null }
        };

        // UI에 폴더 구조 미리 생성 (이모지 제거)
        function initFoldersUI() {
            folderListEl.innerHTML = '';
            for (let key in foldersData) {
                let folderGroupDiv = document.createElement('div');
                folderGroupDiv.className = 'folder-group';

                let folderTitleDiv = document.createElement('div');
                folderTitleDiv.className = 'folder-title';
                folderTitleDiv.innerHTML = `<span>${foldersData[key].title}</span><span>▼</span>`;
                
                let folderItemsDiv = document.createElement('div');
                folderItemsDiv.className = 'folder-items';

                // 폴더 토글 기능
                folderTitleDiv.addEventListener('click', function() {
                    if (folderItemsDiv.style.display === 'none') {
                        folderItemsDiv.style.display = 'block';
                        folderTitleDiv.lastChild.innerText = '▼';
                    } else {
                        folderItemsDiv.style.display = 'none';
                        folderTitleDiv.lastChild.innerText = '▶';
                    }
                });

                folderGroupDiv.appendChild(folderTitleDiv);
                folderGroupDiv.appendChild(folderItemsDiv);
                
                folderListEl.appendChild(folderGroupDiv);
                foldersData[key].el = folderGroupDiv;
                foldersData[key].itemsEl = folderItemsDiv;
                folderGroupDiv.style.display = 'none'; // 초기엔 숨김
            }
        }

        initFoldersUI();

        // 3. KML 불러오기
        omnivore.kml('assets/jae.kml')
            .on('ready', function() {
                let hasAnyItem = false;

                this.eachLayer(function(layer) {
                    let name = (layer.feature && layer.feature.properties && layer.feature.properties.name) ? layer.feature.properties.name : '이름 없는 구역';
                    let description = (layer.feature && layer.feature.properties && layer.feature.properties.description) ? layer.feature.properties.description : '';

                    if (layer.setStyle) {
                        layer.setStyle(defaultStyle);
                    }

                    // 지역 분류 (동대문구 / 중랑구 / 기타)
                    let targetFolder = "기타 구역";
                    if (description.includes("동대문구")) {
                        targetFolder = "동대문구";
                    } else if (description.includes("중랑구")) {
                        targetFolder = "중랑구";
                    }

                    hasAnyItem = true;
                    foldersData[targetFolder].el.style.display = 'block';

                    // 목록 아이템 생성 (이모지 제거, 각진 디자인)
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerText = name;

                    // 목록 클릭 시: 상세 뷰로 전환 및 지도 이동
                    row.addEventListener('click', function(e) {
                        e.stopPropagation();
                        selectZone(name, description, layer);
                        moveToZone(layer);
                        showDetailView(); // 화면 전환
                    });

                    // 지도 위 도형 클릭 시: 상세 뷰로 전환 및 지도 이동
                    layer.on('click', function(e) {
                        L.DomEvent.stopPropagation(e);
                        selectZone(name, description, layer);
                        moveToZone(layer);
                        showDetailView(); // 화면 전환
                    });

                    foldersData[targetFolder].itemsEl.appendChild(row);
                });

                if (!hasAnyItem) {
                    folderListEl.innerHTML = '<div style="padding: 15px; color: #888; text-align: center;">표시할 구역이 없습니다.</div>';
                }
            })
            .on('error', function(err) {
                folderListEl.innerHTML = '<div style="padding: 15px; color: red; text-align: center;">KML 로드 실패 (경로 확인)</div>';
                console.error("KML Load Error:", err);
            })
            .addTo(map);

        // 뒤로가기 버튼 클릭 시 목록 뷰로 복귀 및 도형 선택 해제
        backBtn.addEventListener('click', function() {
            showListView();
            clearSelection();
        });

        // 지도 빈 배경 클릭 시 선택 해제 및 목록 뷰로 전환
        map.on('click', function() {
            clearSelection();
            showListView();
        });

        // 화면 전환 함수들
        function showDetailView() {
            listViewEl.classList.remove('active');
            detailViewEl.classList.add('active');
        }

        function showListView() {
            detailViewEl.classList.remove('active');
            listViewEl.classList.add('active');
        }

        // 구역 선택 공통 함수
        function selectZone(name, description, layer) {
            if (currentlySelectedLayer && currentlySelectedLayer !== layer) {
                if (currentlySelectedLayer.setStyle) {
                    currentlySelectedLayer.setStyle(defaultStyle);
                }
            }

            currentlySelectedLayer = layer;
            if (layer.setStyle) {
                layer.setStyle(selectedStyle);
            }

            detailContentEl.innerHTML = `<h4>${name}</h4><p>${description || '상세 정보가 없습니다.'}</p>`;

            document.querySelectorAll('.item-row').forEach(el => {
                if (el.innerText === name) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // 선택 초기화 함수
        function clearSelection() {
            if (currentlySelectedLayer) {
                if (currentlySelectedLayer.setStyle) {
                    currentlySelectedLayer.setStyle(defaultStyle);
                }
                currentlySelectedLayer = null;
            }
            document.querySelectorAll('.item-row').forEach(el => {
                el.classList.remove('active');
            });
        }

        // 지도 이동 함수
        function moveToZone(layer) {
            if (layer.getBounds) {
                map.fitBounds(layer.getBounds(), { padding: [50, 50] });
            } else if (layer.getLatLng) {
                map.setView(layer.getLatLng(), 16);
            }
        }
    </script>
</body>
</html>
