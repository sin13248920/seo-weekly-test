<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서오일보 - 기사 뷰어</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f6f8;
            color: #333333;
            line-height: 1.6;
        }

        /* 1. 페이지와 함께 스크롤되어 올라가는 큰 헤더 */
        .large-header {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #d1d8dd;
            position: relative;
            z-index: 10;
        }

        .header-main-bar {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        .header-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center; /* 로고 정가운데 정렬 */
            height: 100%;
            position: relative;
        }

        .logo-link {
            display: block;
            text-decoration: none;
        }

        .logo-img-large {
            height: 40px; 
            width: auto;
            display: block;
        }

        .sub-info-bar {
            background-color: #ffffff;
            border-top: 1px solid #f1f3f5;
            border-bottom: 1px solid #e1e4e8;
            font-size: 12px;
            color: #555555;
            height: 36px;
            display: flex;
            align-items: center;
        }

        .sub-info-inner {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stock-market-ticker {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .market-item strong.up { color: #C91C1C; }
        .market-item strong.down { color: #0055ff; }
        .market-divider { color: #cccccc; }

        /* 2. 일정 수준 이상 스크롤했을 때 위에서 나타나는 고정 소형 헤더 */
        .fixed-small-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background-color: #ffffff;
            border-bottom: 1px solid #d1d8dd;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }

        .fixed-small-header.active {
            transform: translateY(0);
        }

        .logo-img-small {
            height: 25px;
            width: auto;
            display: block;
        }

        /* PC용 고정 헤더 내부 컨테이너 (기본 노출) */
        .fixed-pc-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* 모바일 스크롤 시 나타나는 고정 헤더 유틸리티 바 (기본 숨김) */
        .mobile-utility-bar {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
            background-color: #ffffff;
        }

        .mobile-utility-bar .util-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            border-right: 1px solid #eee;
            font-size: 12px;
            font-weight: 600;
            color: #444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .mobile-utility-bar .util-btn:last-child {
            border-right: none;
        }
        .mobile-utility-bar .util-btn:active {
            background-color: #f1f3f5;
        }

        /* 스크롤 프로세스바 */
        .scroll-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #C91C1C;
            transition: width 0.1s ease-out;
        }

        /* 메인 콘텐츠 래퍼 및 PC용 사이드바 */
        .page-wrapper {
            max-width: 800px;
            margin: 40px auto;
            position: relative;
            padding: 0 20px;
        }

        /* PC용 유틸리티 사이드바 (화면 좌측 고정) */
        .utility-sidebar {
            position: absolute;
            left: -70px;
            top: 0;
            width: 50px;
            background: #ffffff;
            border: 1px solid #d1d8dd;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            z-index: 5;
        }

        .utility-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .utility-sidebar .util-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            padding: 8px;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
        }

        .utility-sidebar .util-btn:hover {
            background-color: #f1f3f5;
            color: #C91C1C;
        }

        .util-divider {
            width: 30px;
            height: 1px;
            background-color: #e1e4e8;
            margin: 4px 0;
        }

        /* 기사 본문 영역 임시 스타일 */
        .article-content-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }

        /* 반응형 디자인 (모바일 환경: 768px 이하) */
        @media (max-width: 768px) {
            .sub-info-bar { display: none; }
            .header-main-bar { height: 60px; }
            .logo-img-large { height: 32px; }
            
            /* 1. 모바일 환경에서 좌측 유틸리티 사이드바 완전 삭제 */
            .utility-sidebar {
                display: none !important;
            }

            /* 2. 모바일 고정 소형 헤더 설정: 로고 영역 숨기고 유틸리티 바 꽉 채우기 */
            .fixed-pc-container {
                display: none;
            }
            .mobile-utility-bar {
                display: flex;
            }
            
            .page-wrapper {
                margin: 20px 10px;
                padding: 0;
            }
            .article-content-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. 페이지와 함께 스크롤되어 올라가는 큰 헤더 -->
    <div class="large-header" id="largeHeader">
        <div class="header-main-bar">
            <div class="header-container">
                <a href="index.html" class="logo-link">
                    <img src="assets/seologo.png" alt="서오일보 로고" class="logo-img-large">
                </a>
            </div>
        </div>
        <div class="sub-info-bar">
            <div class="sub-info-inner">
                <span class="current-date" id="headerDate">2026.09.24 (목)</span>
                <div class="stock-market-ticker">
                    <span class="market-item">KOSPI <strong class="up">2,780.50</strong> <span class="change">▲ 12.30 (+0.44%)</span></span>
                    <span class="market-divider">|</span>
                    <span class="market-item">KOSDAQ <strong class="down">850.20</strong> <span class="change">▼ 3.10 (-0.36%)</span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 일정 수준 이상 스크롤했을 때 위에서 스르륵 나타나는 고정 소형 헤더 -->
    <header class="fixed-small-header" id="fixedSmallHeader">
        <!-- PC용 고정 헤더 내용 (로고 정가운데) -->
        <div class="fixed-pc-container">
            <a href="index.html" class="logo-link">
                <img src="assets/seologo.png" alt="서오일보 로고" class="logo-img-small">
            </a>
        </div>

        <!-- 모바일 스크롤 시 상단에 꽉 차게 나타나는 유틸리티 바 -->
        <div class="mobile-utility-bar">
            <button class="util-btn" onclick="changeFontSize(1)">A+ 확대</button>
            <button class="util-btn" onclick="changeFontSize(-1)">A- 축소</button>
            <button class="util-btn" onclick="openPrintWindow()">🖨️ 인쇄</button>
            <button class="util-btn" onclick="alert('기사 링크가 복사되었습니다.')">🔗 공유</button>
        </div>

        <!-- 스크롤 프로세스바 -->
        <div class="scroll-progress-bar" id="scrollProgressBar"></div>
    </header>

    <!-- 메인 래퍼 -->
    <div class="page-wrapper">
        <!-- PC용 유틸리티 사이드바 -->
        <aside class="utility-sidebar" id="utilitySidebar">
            <div class="utility-container">
                <button class="util-btn" title="글자 키우기" onclick="changeFontSize(1)">A+</button>
                <button class="util-btn" title="글자 줄이기" onclick="changeFontSize(-1)">A-</button>
                <div class="util-divider"></div>
                <button class="util-btn" title="인쇄하기" onclick="openPrintWindow()">🖨️</button>
                <div class="util-divider"></div>
                <button class="util-btn" title="공유하기" onclick="alert('기사 링크가 복사되었습니다.')">🔗</button>
            </div>
        </aside>

        <!-- 기사 본문 영역 -->
        <main class="article-content-container">
            <h1>기사 제목이 이곳에 표시됩니다</h1>
            <br>
            <p>기사 본문 내용이 들어가는 자리입니다. 스크롤을 내려 헤더의 변화와 모바일 환경에서의 유틸리티 바 배치를 확인해보세요.</p>
            <div style="height: 1500px; background: linear-gradient(to bottom, #ffffff, #f1f3f5); margin-top: 20px; display: flex; align-items: center; justify-content: center; color: #888;">
                [스크롤 테스트용 긴 본문 공간]
            </div>
        </main>
    </div>

    <script>
        // 스크롤 및 고정 헤더, 프로세스바 연동 스크립트
        window.addEventListener('scroll', function() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const smallHeader = document.getElementById('fixedSmallHeader');
            const largeHeader = document.getElementById('largeHeader');
            const progressBar = document.getElementById('scrollProgressBar');

            // 대형 헤더의 높이 기준점 (약 111px)을 넘으면 소형 헤더 활성화
            if (scrollTop > 110) {
                smallHeader.classList.add('active');
            } else {
                smallHeader.classList.remove('active');
            }

            // 스크롤 프로세스바 계산
            const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;
            if (progressBar) {
                progressBar.style.width = scrollPercent + '%';
            }
        });

        // 폰트 크기 변경 함수 예시
        function changeFontSize(step) {
            const content = document.querySelector('.article-content-container');
            let currentSize = parseFloat(window.getComputedStyle(content).fontSize);
            content.style.fontSize = (currentSize + step) + 'px';
        }

        // 인쇄 함수 예시
        function openPrintWindow() {
            window.print();
        }
    </script>
</body>
</html>
