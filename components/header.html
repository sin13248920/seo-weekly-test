<!-- components/header.html -->

<!-- 1. 페이지와 함께 스크롤되어 올라가는 큰 헤더 (일반 문서 흐름) -->
<div class="large-header" id="largeHeader">
    <div class="header-main-bar">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <img src="assets/seologo.png" alt="서오일보 로고" class="logo-img-large">
            </a>
        </div>
    </div>
    <div class="sub-info-bar">
        <div class="sub-info-inner">
            <span class="current-date" id="headerDate">2026.09.11 (금)</span>
            <div class="stock-market-ticker">
                <span class="market-item">KOSPI <strong class="up">2,780.50</strong> <span class="change">▲ 12.30 (+0.44%)</span></span>
                <span class="market-divider">|</span>
                <span class="market-item">KOSDAQ <strong class="down">850.20</strong> <span class="change">▼ 3.10 (-0.36%)</span></span>
            </div>
        </div>
    </div>
</div>

<!-- 2. 일정 수준 이상 스크롤했을 때 위에서 스르륵 나타나는 고정 소형 헤더 -->
<header class="fixed-small-header" id="fixedSmallHeader">
    <div class="header-container">
        <a href="index.html" class="logo-link">
            <img src="assets/seologo.png" alt="서오일보 로고" class="logo-img-small">
        </a>
    </div>
    <!-- viewer.html에서만 작동할 스크롤 프로세스바 -->
    <div class="scroll-progress-bar" id="scrollProgressBar"></div>
</header>

<style>
    /* 큰 헤더 영역 (페이지와 함께 스크롤됨) */
    .large-header {
        width: 100%;
        background-color: #ffffff;
        border-bottom: 1px solid #d1d8dd;
    }

    .header-main-bar {
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
    }

    .header-container {
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        position: relative;
    }

    .logo-link {
        display: block;
        text-decoration: none;
    }

    .logo-img-large {
        height: 40px; 
        width: auto;
        display: block;
    }

    /* 날짜 및 주가 정보 바 (흰색 배경) */
    .sub-info-bar {
        background-color: #ffffff;
        border-top: 1px solid #f1f3f5;
        border-bottom: 1px solid #e1e4e8;
        font-size: 12px;
        color: #555555;
        height: 36px;
        display: flex;
        align-items: center;
    }

    .sub-info-inner {
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .stock-market-ticker {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .market-item strong.up { color: #C91C1C; }
    .market-item strong.down { color: #0055ff; }
    .market-divider { color: #cccccc; }

    /* 고정 소형 헤더 스타일 (기본에는 화면 위로 숨겨져 있음) */
    .fixed-small-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 52px;
        background-color: #ffffff;
        border-bottom: 1px solid #d1d8dd;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        transform: translateY(-100%);
        transition: transform 0.3s ease;
    }

    .fixed-small-header.active {
        transform: translateY(0); /* 스크롤 내리면 화면 안으로 내려옴 */
    }

    .logo-img-small {
        height: 25px;
        width: auto;
        display: block;
    }

    /* 스크롤 프로세스바 */
    .scroll-progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background-color: #C91C1C;
        transition: width 0.1s ease-out;
        display: none; 
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
        .sub-info-bar { display: none; } /* 모바일에서는 하단 정보바 숨김 */
        .header-main-bar { height: 60px; }
        .logo-img-large { height: 32px; }
        .fixed-small-header { height: 48px; }
        .logo-img-small { height: 22px; }
    }
</style>
