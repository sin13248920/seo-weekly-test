<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주가종합지수 현황</title>
    <style>
        .stock-table {
            width: 100%;
            max-width: 500px;
            border-collapse: collapse;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 20px 0;
        }
        .stock-table th, .stock-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid #dddddd;
        }
        .stock-table th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: bold;
        }
        .stock-table td:first-child, .stock-table th:first-child {
            text-align: left;
        }
        .up { color: #d63031; font-weight: bold; }   /* 상승 (빨간색) */
        .down { color: #0984e3; font-weight: bold; } /* 하락 (파란색) */
    </style>
</head>
<body>

    <h3>📈 주요 주가종합지수</h3>
    <table class="stock-table">
        <thead>
            <tr>
                <th>지수명</th>
                <th>현재 지수</th>
                <th>변동량</th>
                <th>등락률</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong>코스피 (KOSPI)</strong></td>
                <td>6,909.91</td>
                <td class="down">▼ 124.01</td>
                <td class="down">-1.76%</td>
            </tr>
            <tr>
                <td><strong>코스닥 (KOSDAQ)</strong></td>
                <td>820.64</td>
                <td class="down">▼ 9.72</td>
                <td class="down">-1.17%</td>
            </tr>
            <tr>
                <td><strong>S&P 500</strong></td>
                <td>7,591.70</td>
                <td class="down">▼ 44.66</td>
                <td class="down">-0.58%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
