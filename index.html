<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데일리 뉴스 - 홈</title>
    <!-- 브라우저 탭 아이콘 (파비콘) 설정 -->
    <link rel="icon" href="assets/favi.png" type="image/png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #222222;
            line-height: 1.6;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 고정된 헤더 스타일 */
        header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            z-index: 1000;
            border-bottom: 1px solid #d1d8dd;
            display: flex;
            align-items: center;
        }

        .header-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-img {
            height: 28px;
            width: auto;
            display: block;
        }

        .header-nav {
            font-size: 14px;
            font-weight: 600;
            color: #555555;
        }

        /* 메인 콘텐츠 래퍼 */
        .main-wrapper {
            max-width: 1000px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: #111111;
            margin-bottom: 24px;
            border-left: 4px solid #C91C1C;
            padding-left: 12px;
            letter-spacing: -0.5px;
        }

        /* 기사 카드 그리드 레이아웃 */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .article-card {
            background-color: #ffffff;
            border: 1px solid #d1d8dd;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .article-card:hover {
            transform: translateY(-4px);
            border-color: #111111;
        }

        .card-thumb-wrap {
            width: 100%;
            height: 180px;
            background-color: #f1f3f5;
            overflow: hidden;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #adb5bd;
            font-size: 13px;
        }

        .card-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-category {
            font-size: 12px;
            color: #C91C1C;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #111111;
            line-height: 1.45;
            margin-bottom: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-date {
            font-size: 12px;
            color: #888888;
            margin-top: auto;
        }

        /* 로딩 및 안내 메시지 */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            font-size: 15px;
            color: #666666;
            background-color: #ffffff;
            border: 1px solid #d1d8dd;
        }

        /* 푸터 영역 */
        footer {
            background-color: #ffffff;
            border-top: 1px solid #d1d8dd;
            padding: 40px 20px;
            font-size: 13px;
            color: #666666;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-logo-img {
            height: 24px;
            width: auto;
            display: block;
            margin-bottom: 10px;
        }

        .footer-copyright {
            color: #999999;
            font-size: 12px;
        }

        /* 반응형 디자인 (태블릿, 모바일) */
        @media (max-width: 850px) {
            .article-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .article-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <div class="header-container">
            <a href="index.html">
                <img src="assets/seologo.png" alt="데일리 뉴스 로고" class="logo-img">
            </a>
            <div class="header-nav">LATEST NEWS</div>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-wrapper">
        <h2 class="section-title">최신 기사</h2>
        
        <!-- 기사 카드들이 동적으로 꽂힐 그리드 컨테이너 -->
        <div class="article-grid" id="articleGrid">
            <div class="status-message">기사 목록을 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 푸터 영역 -->
    <footer>
        <div class="footer-inner">
            <div>
                <img src="assets/seologo.png" alt="데일리 뉴스 로고" class="footer-logo-img">
                <div class="footer-copyright">
                    Copyright &copy; Daily News All rights reserved. 무단 전재 및 재배포 금지.
                </div>
            </div>
        </div>
    </footer>

    <!-- 자바스크립트: 기사 자동 로드 및 정렬 로직 -->
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // ⭐ [중요] 여기에 보유하고 계신 기사 JSON 파일들의 이름(확장자 제외)을 리스트업 해주세요.
            // 나중에 기사가 추가될 때마다 이 배열에 ID만 계속 추가해 주시면 됩니다!
            const articleIds = ["26091101", "26091102", "26091103"]; // 예시 ID들

            const gridContainer = document.getElementById('articleGrid');

            if (articleIds.length === 0) {
                gridContainer.innerHTML = `<div class="status-message">등록된 최신 기사가 없습니다.</div>`;
                return;
            }

            // 요청하신 대로 파일 이름의 숫자 크기 기준 '내림차순 정렬' (큰 숫자 = 가장 최신 기사무더기가 앞으로 옴)
            articleIds.sort((a, b) => Number(b) - Number(a));

            // 비동기로 모든 JSON 파일을 읽어옴
            const fetchPromises = articleIds.map(id => {
                return fetch(`articles/${id}.json`)
                    .then(response => {
                        if (!response.ok) throw new Error(`ID ${id} 데이터 로드 실패`);
                        return response.json();
                    })
                    .catch(err => {
                        console.warn(err);
                        return null; // 에러 난 파일은 무시
                    });
            });

            Promise.all(fetchPromises).then(results => {
                // 정상적으로 불러와진 데이터만 필터링
                const validArticles = results.filter(article => article !== null);

                if (validArticles.length === 0) {
                    gridContainer.innerHTML = `<div class="status-message">불러올 수 있는 기사 데이터가 없습니다.</div>`;
                    return;
                }

                gridContainer.innerHTML = ''; // 로딩 문구 초기화

                // 각 기사 데이터를 반복 돌며 카드 생성 및 렌더링
                validArticles.forEach(data => {
                    const card = document.createElement('a');
                    card.className = 'article-card';
                    // 클릭하면 아까 만드신 viewer.html로 기사 ID를 들고 이동합니다!
                    card.href = `viewer.html?id=${data.id}`;

                    // 이미지가 있으면 이미지 태그, 없으면 '이미지 없음' 표시
                    let thumbHtml = `<div class="card-thumb-wrap">이미지 없음</div>`;
                    if (data.image) {
                        thumbHtml = `<div class="card-thumb-wrap"><img src="${data.image}" alt="${data.title}"></div>`;
                    }

                    card.innerHTML = `
                        ${thumbHtml}
                        <div class="card-body">
                            <span class="card-category">${data.category}</span>
                            <h3 class="card-title">${data.title}</h3>
                            <span class="card-date">${data.date}</span>
                        </div>
                    `;

                    gridContainer.appendChild(card);
                });
            });
        });
    </script>

</body>
</html>
